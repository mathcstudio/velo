<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>위치의 변화량과 움직인 거리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 한 열짜리 등산로(정상이 위). 문제 화면은 넓은 태블릿(가로)에서 문제·풀이 / 입력 두 열로 나뉜다. */
:root {
  --paper: #EEF3F4; --contour: #DCE6E8; --ink: #13262B; --muted: #55696F; --surface: #FFFFFF; --line: #BFCED2;
  --accent: #0F6B78; --on-accent: #FFFFFF; --flag: #D2541B; --good: #1B7F4A; --good-soft: #DDF3E6;
  --bad: #C0352F; --bad-soft: #FBE3E1; --band: #12262B; --on-band: #EAF2F4; --rock1: #7C959B; --rock2: #4E666C;
  --display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --hand: "Nanum Pen Script", "Noto Sans KR", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1A1E; --contour: #15272C; --ink: #E6F0F2; --muted: #98AEB4; --surface: #152429; --line: #2B4148;
    --accent: #5CC4D3; --on-accent: #0D1A1E; --flag: #F08A4B; --good: #5FD08F; --good-soft: #173626;
    --bad: #F0827B; --bad-soft: #3B1C1B; --band: #081215; --on-band: #E6F0F2; --rock1: #3D555C; --rock2: #26393F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1A1E; --contour: #15272C; --ink: #E6F0F2; --muted: #98AEB4; --surface: #152429; --line: #2B4148;
  --accent: #5CC4D3; --on-accent: #0D1A1E; --flag: #F08A4B; --good: #5FD08F; --good-soft: #173626;
  --bad: #F0827B; --bad-soft: #3B1C1B; --band: #081215; --on-band: #E6F0F2; --rock1: #3D555C; --rock2: #26393F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background-color: var(--paper);
  background-image: repeating-radial-gradient(ellipse 120% 80% at 50% 0%, transparent 0 46px, var(--contour) 46px 48px);
  color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
.wrap {
  max-width: 780px; margin: 0 auto; padding-block: 16px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.wrap.wide { max-width: 1180px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: clamp(30px, 7vw, 46px); }
h1 span { color: var(--accent); }
h2 { font-size: 24px; }
.btn { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 18px; font-weight: 700; font-size: 17px; min-height: 50px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { font-size: 15px; padding: 6px 14px; min-height: 44px; font-weight: 500; }
.btn:disabled { opacity: .55; cursor: default; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }

/* 상단 바 */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.bar .who { font-weight: 700; }
.bar .total { font-family: var(--display); font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }
.bar .right { display: flex; align-items: center; gap: 10px; }
.sync { font-size: 12px; color: var(--muted); }
.sync.bad { color: var(--bad); font-weight: 700; }

/* 등산로 */
.trail { display: flex; flex-direction: column; }
.camp { position: relative; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding-bottom: 18px; }
.camp::before { content: ""; position: absolute; left: 31px; top: 34px; bottom: -4px; border-left: 3px dashed var(--line); }
.camp:last-child::before { display: none; }
.camp.passed::before { border-left: 3px solid var(--accent); }
.alt { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.peg { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line); display: grid; place-items: center; font-size: 15px; font-weight: 700; }
.camp.open .peg { border-color: var(--flag); color: var(--flag); }
.camp.passed .peg { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.alt small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; background: var(--paper); padding: 0 2px; }
.camp-body { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.camp.open .camp-body { border-color: var(--flag); }
.camp.locked .camp-body { opacity: .6; }
.camp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.camp-head .nm { font-family: var(--display); font-size: 21px; }
.camp-head .tp { font-weight: 700; color: var(--accent); margin-left: 8px; font-size: 16px; }
.camp-head .st { font-size: 14px; font-weight: 700; color: var(--muted); }
.camp.open .st { color: var(--flag); } .camp.passed .st { color: var(--good); }
.tip { margin: 0; font-size: 15px; color: var(--muted); }
.ex { font-size: 15px; background: var(--paper); border-radius: 10px; padding: 6px 12px; overflow-x: auto; }
.ex b { font-size: 12px; letter-spacing: .08em; color: var(--muted); margin-right: 8px; }
.tier { display: flex; flex-direction: column; gap: 6px; }
.tier-head { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.tier-head .ok { color: var(--good); }
.routes { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.route { border: 1.5px solid var(--line); border-radius: 12px; background: var(--paper); padding: 8px 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-height: 62px; }
.route b { font-size: 16px; }
.route span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.route.done { background: var(--good-soft); border-color: var(--good); }
.route.done span { color: var(--good); font-weight: 700; }
.route.going { border-color: var(--flag); }
.route.essay b::after { content: " ✎"; }
.banner { background: var(--accent); color: var(--on-accent); border-radius: 14px; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.banner b { font-family: var(--display); font-weight: 400; font-size: 22px; }
.banner .btn { border-color: transparent; color: var(--ink); }

/* 문제 화면 */
.prob { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
@media (min-width: 960px) { .prob { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.q { font-size: clamp(19px, 3.2vw, 27px); text-align: center; padding: 14px 4px; overflow-x: auto; line-height: 2; word-break: keep-all; }
.q.text { text-align: left; font-size: clamp(17px, 2.4vw, 21px); }
.meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 700; color: var(--muted); }
.meta .miss { color: var(--bad); }
.log { display: flex; flex-direction: column; gap: 6px; border-top: 1.5px dashed var(--line); padding-top: 12px; }
.log h3, .now h3 { font-size: 13px; letter-spacing: .08em; color: var(--muted); margin: 0; font-weight: 700; }
.logline { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px; align-items: center; background: var(--good-soft); border-radius: 8px; padding: 6px 10px; overflow-x: auto; font-size: 16px; }
.logline i { font-style: normal; font-weight: 700; color: var(--good); }
.logline.new { animation: pop .45s ease-out; }
.essay-log { white-space: pre-wrap; word-break: break-word; }
.now { display: flex; flex-direction: column; gap: 12px; }
.now-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tries { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
.tries i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); display: inline-block; }
.tries i.used { background: transparent; border: 2px solid var(--line); }
.prompt { margin: 0; font-weight: 700; font-size: 17px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.opt { border: 2px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px 14px; min-height: 68px; font-size: 17px; overflow-x: auto; text-align: center; }
.opt.t { text-align: left; font-size: 16px; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); opacity: .7; }
.fields { display: flex; flex-wrap: wrap; gap: 10px; }
.field { flex: 1 1 200px; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); padding: 8px 12px; min-height: 60px; text-align: left; }
.field .val { font-size: 22px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; min-height: 1.4em; }
.field.active { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.field.ok { border-color: var(--good); background: var(--good-soft); }
.field.no { border-color: var(--bad); background: var(--bad-soft); }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 440px; width: 100%; margin: 0 auto; }
.key { border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 23px; font-weight: 700; min-height: 58px; }
.key:active { background: var(--paper); }
.key.go { grid-column: span 3; background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-size: 18px; }
.hint { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
.fb { margin: 0; font-weight: 700; min-height: 1.5em; }
.fb.no { color: var(--bad); } .fb.ok { color: var(--good); }
.wait { margin: 0; font-size: 15px; font-weight: 700; color: var(--flag); font-variant-numeric: tabular-nums; }
.wait:empty { display: none; }
.opt:disabled, .key:disabled { opacity: .55; cursor: default; }
.hintbox { border-left: 4px solid var(--flag); background: var(--paper); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 15px; overflow-x: auto; }
.hintbox b { display: block; font-size: 13px; letter-spacing: .08em; color: var(--flag); }
.hintbox p { margin: 2px 0 0; }
.hintbox p + p { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.done-box { background: var(--good-soft); border: 1.5px solid var(--good); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; animation: pop .5s ease-out; }
.done-box p { margin: 0; }
.done-box .route { background: var(--surface); }
.route:disabled { opacity: .5; cursor: default; }
.done-box > b { font-family: var(--display); font-weight: 400; font-size: 24px; color: var(--good); }
.fail-box { background: var(--bad-soft); border: 1.5px solid var(--bad); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.fail-box > b { font-family: var(--display); font-weight: 400; font-size: 21px; color: var(--bad); }
.fail-box p { margin: 0; }
.fail-box .row { display: flex; gap: 10px; flex-wrap: wrap; }
.essay-f { display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 700; color: var(--muted); }
.essay-f textarea { width: 100%; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 14px; min-height: 64px; resize: vertical; line-height: 1.6; font-size: 17px; font-weight: 400; color: var(--ink); }
.essay-f textarea:focus { border-color: var(--accent); outline: none; }
.symbols { display: flex; flex-wrap: wrap; gap: 6px; }
.symbols button { border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); min-width: 48px; min-height: 46px; font-size: 18px; font-weight: 700; }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes pop { 0% { transform: scale(.94); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); } }

/* 등반 기록 */
.sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.sum div { background: var(--paper); border-radius: 10px; padding: 10px 12px; }
.sum small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.sum b { font-family: var(--display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.rec { display: flex; flex-direction: column; gap: 8px; border-top: 1.5px solid var(--line); padding-top: 14px; }
.rec-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-weight: 700; }
.rec-head span { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rec .q { font-size: 17px; padding: 4px; text-align: left; line-height: 1.9; }
.empty { color: var(--muted); margin: 0; }

/* 축하 장면 */
.cele { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; overflow: hidden; background-color: var(--surface);
  background-image: linear-gradient(var(--contour) 1px, transparent 1px), linear-gradient(90deg, var(--contour) 1px, transparent 1px); background-size: 28px 28px;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fadein .35s ease-out; }
.cele canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cele-in { position: relative; width: min(560px, 100%); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.cele svg { width: 100%; height: auto; max-height: 46vh; display: block; }
.cele .kicker { font-size: 14px; font-weight: 700; letter-spacing: .14em; color: var(--accent); margin: 0; }
.cele h2 { font-size: clamp(34px, 8vw, 56px); animation: rise .6s .9s both cubic-bezier(.2, .9, .3, 1.3); }
.cele .altnum { font-family: var(--display); font-size: clamp(26px, 6vw, 40px); color: var(--flag); font-variant-numeric: tabular-nums; margin: 0; line-height: 1.1; }
.cele .sub { margin: 0; color: var(--muted); font-size: 16px; animation: rise .5s 1.3s both; }
.cele .btn { margin-top: 6px; min-width: 200px; animation: rise .5s 1.6s both; }
@keyframes rise { from { transform: translateY(18px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .cele, .cele h2, .cele .sub, .cele .btn, .done-box, .logline.new, .shake { animation: none; }
  .cv-climber, .cv-strip, .tour-ring, .tour-box { transition: none; } .quake { animation: none; }
}

/* 개념 정리 팝업 */
.note { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(8, 20, 24, .66); overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fadein .25s ease-out; }
.note-in { width: min(620px, 100%); background: var(--surface); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 12px; border-top: 8px solid var(--flag); animation: pop .4s ease-out; }
.note-in .kicker { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--flag); }
.note-in .say { margin: 0; font-size: 18px; font-weight: 700; word-break: keep-all; }
.formula { background: var(--paper); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; overflow-x: auto; font-size: 18px; line-height: 2; }
.memo { margin: 0; background: var(--paper); border-left: 4px solid var(--flag); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 16px; }
.note-in .chk { display: flex; align-items: center; gap: 10px; font-weight: 700; min-height: 48px; }
.note-in .chk input { width: 24px; height: 24px; accent-color: var(--accent); }
/* 마지막 관문 */
.gate { display: flex; flex-direction: column; gap: 14px; }
.gate-item { display: flex; flex-direction: column; gap: 10px; }
.gate-item.ok { border-color: var(--good); background: var(--good-soft); }
.gate-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 700; }
.gate-head .ok { color: var(--good); }
.blanks { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.blanks label { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.blanks input { width: 96px; min-height: 50px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); padding: 6px 12px; font-size: 20px; text-align: center; }
.blanks input:focus { border-color: var(--accent); outline: none; }
.blanks input.no { border-color: var(--bad); background: var(--bad-soft); }
/* 관리자 */
.admin { display: flex; flex-direction: column; gap: 14px; }
.admin .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.admin input[type=password] { flex: 1 1 200px; min-width: 0; min-height: 50px; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--surface); font-size: 17px; }
.admin .note-line { margin: 0; color: var(--muted); font-size: 14px; }
.admin .err { margin: 0; color: var(--bad); font-weight: 700; min-height: 1.5em; }
.tbl-wrap { overflow-x: auto; border: 1.5px solid var(--line); border-radius: 12px; }
table.rate { border-collapse: collapse; width: 100%; min-width: 720px; font-variant-numeric: tabular-nums; }
table.rate th, table.rate td { padding: 8px 10px; text-align: center; border-bottom: 1px solid var(--line); font-size: 15px; }
table.rate thead th { font-size: 13px; color: var(--muted); background: var(--paper); line-height: 1.3; }
table.rate thead th small { display: block; font-weight: 400; }
table.rate tbody th { text-align: left; white-space: nowrap; }
table.rate tbody th button { border: 0; background: none; font-weight: 700; padding: 6px 0; min-height: 40px; text-decoration: underline; text-underline-offset: 3px; }
table.rate td b { display: block; font-size: 17px; }
table.rate td small { color: var(--muted); font-size: 12px; }
table.rate tr.tot th, table.rate tr.tot td { border-top: 2px solid var(--ink); border-bottom: 0; font-weight: 700; }
table.rate tr.sel th { box-shadow: inset 4px 0 0 var(--flag); }
table.list { border-collapse: collapse; width: 100%; min-width: 520px; font-variant-numeric: tabular-nums; }
table.list th, table.list td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); font-size: 15px; }
table.list th { font-size: 13px; color: var(--muted); background: var(--paper); }
@media (prefers-reduced-motion: reduce) { .note, .note-in { animation: none; } }

/* 서술길 쓰는 법 */
table.how { border-collapse: collapse; width: 100%; }
table.how th, table.how td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: 16px; }
table.how th { font-size: 14px; color: var(--muted); white-space: nowrap; }
kbd { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
/* 관리자: 서술 답안 */
table.list tr.sel td { background: var(--paper); }
.essays { display: flex; flex-direction: column; gap: 12px; }
.essay-card { border: 1.5px solid var(--line); border-left: 6px solid var(--bad); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.essay-card.ok { border-left-color: var(--good); }
.essay-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); }
.essay-head b { color: var(--ink); font-size: 16px; }
.badge { font-weight: 700; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); }
.badge.ok { background: var(--good-soft); color: var(--good); }
.essay-card .q { font-size: 17px; padding: 0; text-align: left; line-height: 1.8; }
.essay-card .essay-log { background: var(--paper); border-radius: 10px; padding: 10px 12px; font-size: 16px; }

/* 첫 화면: 곡선을 오르는 산 */
.wrap.intro-view { padding-block: 0; max-width: 820px; gap: 0; }
.hero { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  background-color: var(--surface); background-image: linear-gradient(var(--contour) 1px, transparent 1px), linear-gradient(90deg, var(--contour) 1px, transparent 1px); background-size: 28px 28px; }
.hero-top { padding: clamp(20px, 5vh, 44px) clamp(20px, 5vw, 44px) 0; }
.hero-top .kick { margin: 0; font-family: var(--hand); font-size: clamp(22px, 4.2vw, 32px); color: var(--flag); line-height: 1; }
.hero-top h1 { font-size: clamp(48px, 12vw, 96px); line-height: 1; margin-top: 6px; }
.hero-art { flex: 1 1 auto; display: flex; align-items: flex-end; min-height: 0; padding-inline: clamp(0px, 2vw, 20px); }
.hero-art svg { width: 100%; height: auto; max-height: 56vh; display: block; overflow: visible; }
.hero-form { background: var(--band); color: var(--on-band); padding: 20px clamp(20px, 5vw, 44px) max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.hero-form .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.who-f { display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 700; flex: 0 1 150px; min-width: 110px; }
.who-f.grow { flex: 1 1 180px; }
.hero-form input { width: 100%; min-width: 0; border: 0; border-radius: 12px; padding: 10px 14px; background: #FFFFFF; color: #12262B; font-size: 18px; font-weight: 400; min-height: 54px; }
.hero-form input::placeholder { color: #8A9BA0; }
.hero-form input:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }
.btn.start { background: var(--flag); border-color: var(--flag); color: #FFFFFF; min-height: 54px; font-size: 19px; padding-inline: 26px; flex: 0 0 auto; }
.hero-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; }
.hero-foot .err { margin: 0; color: #FFB4A0; font-weight: 700; }
.link { background: none; border: 0; color: var(--on-band); opacity: .7; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; min-height: 44px; padding: 0 4px; }
/* 산 그림 */
.cv-strip { fill: var(--paper); stroke: var(--surface); stroke-width: 2; transition: fill .8s ease; }
.cv-strip.on { fill: var(--c); }
.cv-line { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.cv-axis { stroke: var(--ink); stroke-width: 2; }
.cv-x { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 13px; fill: var(--ink); text-anchor: middle; }
.cv-name { font-family: var(--body); font-weight: 700; fill: var(--muted); text-anchor: middle; }
.cv-name.dark { fill: #FFFFFF; } .cv-name.light { fill: #12262B; }
.cv-dot { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.cv-pole { stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }
.cv-flag { fill: var(--flag); }
.cv-hand { font-family: var(--hand); font-size: 17px; fill: var(--flag); text-anchor: end; }
.cv-climber { transition: transform 1.3s cubic-bezier(.45, .05, .3, 1); }
.cv-climber .head { fill: var(--flag); }
.cv-climber .body { stroke: var(--ink); stroke-width: 2.4; fill: none; stroke-linecap: round; }
.cv-climber .stick { stroke: var(--ink); stroke-width: 1.6; }

/* 밝게 비추는 안내 */
.tour { position: fixed; inset: 0; z-index: 55; }
.tour-ring { position: fixed; border-radius: 14px; box-shadow: 0 0 0 200vmax rgba(8, 20, 24, .76); outline: 3px solid #F2B705; outline-offset: 3px; pointer-events: none; transition: left .4s, top .4s, width .4s, height .4s; }
.tour-box { position: fixed; background: var(--surface); color: var(--ink); border-radius: 14px; border-top: 6px solid var(--flag); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; transition: top .4s, left .4s; }
.tour-box .n { font-family: var(--display); font-weight: 400; color: var(--flag); font-size: 15px; }

/* 산사태 장면 */
.cele.slide .kicker { color: var(--bad); }
.cele.slide h2 { color: var(--bad); animation-delay: .2s; }
.cele.slide .sub { animation-delay: 2.1s; max-width: 30em; }

.rock { fill: var(--rock2); stroke: var(--ink); stroke-width: 1; opacity: 0; }
.rock.dust { fill: var(--rock1); stroke: none; }

@keyframes quake { 0% { transform: translate(0, 0); } 25% { transform: translate(-3px, 2px); } 50% { transform: translate(3px, -1px); } 75% { transform: translate(-2px, -2px); } 100% { transform: translate(0, 0); } }

/* 생각하게 하는 장치: 눌러야 보이는 예시·힌트, 빈칸이 있는 식 */
.peek { border-style: dashed; color: var(--muted); }
.fields.few .field { flex: 1 1 130px; }

/* 관리자: 학생 삭제 */
.btn.danger { border-color: var(--bad); color: var(--bad); }

.btn.danger:disabled { border-color: var(--line); color: var(--muted); background: transparent; }

.note-in.danger .kicker { color: var(--bad); }
.note-in .row { display: flex; gap: 10px; flex-wrap: wrap; }
.pickbox { width: 24px; height: 24px; accent-color: var(--accent); }

/* 서술길: 기회를 다 쓴 뒤의 선택과 선생님 확인 요청 */
.essay-log.mine { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.pick2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.pick2 .btn { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; min-height: 84px; padding: 12px 14px; }
.pick2 .btn small { font-weight: 400; font-size: 14px; line-height: 1.4; }
.fail-box.wait-box { background: var(--paper); border-color: var(--accent); }
.fail-box.wait-box > b { color: var(--accent); }
.reviews { display: flex; flex-direction: column; gap: 12px; border: 2px solid var(--flag); border-radius: 14px; padding: 14px; }
.reviews h2 { color: var(--flag); }
.essay-card.rv { border-left-color: var(--flag); }
.essay-card .row { display: flex; gap: 8px; flex-wrap: wrap; }

/* 관리자: 문항별 오답률 */
.admin h2 small { font-family: var(--body); font-size: 15px; font-weight: 700; color: var(--accent); margin-left: 8px; }
table.items { min-width: 860px; }
table.items th { white-space: nowrap; font-size: 14px; color: var(--ink); background: transparent; }
table.items thead th { color: var(--muted); background: var(--paper); font-size: 13px; }
table.items .qcell { font-size: 14px; max-width: 300px; overflow-x: auto; }
.meter { display: inline-block; vertical-align: middle; width: 70px; height: 10px; border-radius: 5px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; margin-right: 8px; }
.meter i { display: block; height: 100%; background: var(--bad); }
table.items .hot { color: var(--bad); font-weight: 700; }
table.items .pick { display: inline-block; vertical-align: middle; }

/* 산 그림: 정상 너머 보너스 봉우리 */
.cv-ridge { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 3 5; stroke-linecap: round; }
.cv-star { fill: var(--surface); stroke: var(--muted); stroke-width: 1.6; stroke-linejoin: round; transition: fill .5s ease, stroke .5s ease; transform-box: fill-box; transform-origin: center; }
.cv-star.on { fill: #F2B705; stroke: var(--ink); }
.cv-star.pop { animation: starpop .7s cubic-bezier(.2, .9, .3, 1.4); }
.cv-bonus { font-family: var(--body); font-size: 8px; font-weight: 700; fill: var(--muted); text-anchor: middle; letter-spacing: 1px; }

@media (prefers-reduced-motion: reduce) { .cv-star, .cv-star.pop { transition: none; animation: none; } }

/* ===================== 위치의 변화량과 움직인 거리: 추가 모양 ===================== */
.hero-top h1.long { font-size: clamp(34px, 7.4vw, 64px); line-height: 1.08; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.learn-btn.primary { min-height: 56px; font-size: 18px; padding-inline: 24px; }
.camp::before { top: 34px; }

/* 도로(수직선) 위의 버스 */
.rt-road { stroke: var(--ink); stroke-width: 2.2; }
.rt-seg { fill: var(--paper); stroke: var(--line); stroke-width: 1; transition: fill .8s ease; }
.rt-seg.on { fill: var(--c); stroke: var(--c); }
.rt-stop { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.rt-stop.on { fill: var(--accent); }
.rt-name { font-family: var(--body); font-weight: 700; font-size: 11px; fill: var(--muted); text-anchor: middle; }
.rt-name.on { fill: var(--accent); }
.rt-end { font-family: var(--body); font-size: 10px; font-weight: 700; fill: var(--muted); text-anchor: middle; }
.rt-hand { fill: none; stroke: var(--flag); stroke-width: 2.4; stroke-linecap: round; opacity: .55; stroke-dasharray: 2 6; }
.rt-handlab { font-family: var(--hand); font-size: 19px; fill: var(--flag); text-anchor: end; }
.rt-bus { transition: transform 1.3s cubic-bezier(.45, .05, .3, 1); }
.rt-bus .b-body { fill: var(--flag); stroke: var(--ink); stroke-width: 1.4; }
.rt-bus .b-win { fill: #FFFFFF; opacity: .9; }
.rt-bus .b-wheel { fill: var(--ink); stroke: var(--surface); stroke-width: 1.6; }
.rt-star { fill: var(--surface); stroke: var(--muted); stroke-width: 1.6; stroke-linejoin: round; transition: fill .5s ease; transform-box: fill-box; transform-origin: center; }
.rt-star.on { fill: #F2B705; stroke: var(--ink); }
.rt-star.pop { animation: starpop .7s cubic-bezier(.2, .9, .3, 1.4); }
@media (prefers-reduced-motion: reduce) { .rt-bus, .rt-seg, .rt-star { transition: none; animation: none; } }

/* 문제 그림 */
.fig { display: flex; justify-content: center; padding: 4px 0 8px; }
.fig svg { width: 100%; max-width: 460px; height: auto; display: block; }
.q.text small { font-size: .78em; color: var(--muted); }

/* 속도-시간 그래프 */
.vt-grid { stroke: var(--contour); stroke-width: 1; }
.vt-tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; font-family: var(--body); }
.vt-axis { stroke: var(--ink); stroke-width: 1.6; }
.vt-curve { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
.vt-pos { fill: color-mix(in srgb, var(--accent) 38%, transparent); stroke: none; }
.vt-neg { fill: color-mix(in srgb, var(--flag) 42%, transparent); stroke: none; }
.vt-lab { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 14px; fill: var(--ink); }
.vt-cursor { stroke: var(--flag); stroke-width: 1.6; stroke-dasharray: 4 4; }
.vt-dot { fill: var(--flag); stroke: var(--surface); stroke-width: 2; }

/* 수직선 */
.nl-axis { stroke: var(--ink); stroke-width: 1.8; }
.nl-arrhead { fill: var(--ink); }
.nl-tick { stroke: var(--ink); stroke-width: 1.4; }
.nl-num { font-size: 11px; fill: var(--muted); text-anchor: middle; font-family: var(--body); font-variant-numeric: tabular-nums; }
.nl-mark { font-size: 12px; font-weight: 700; fill: var(--ink); text-anchor: middle; font-family: var(--body); }
.nl-leg { stroke-width: 3; stroke-linecap: round; }
.nl-leg.c0, .nl-head.c0 { stroke: var(--accent); fill: var(--accent); }
.nl-leg.c1, .nl-head.c1 { stroke: var(--flag); fill: var(--flag); }
.nl-leg.c2, .nl-head.c2 { stroke: var(--good); fill: var(--good); }
.nl-head { stroke: none !important; }
.nl-drop { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.nl-pt { fill: var(--flag); stroke: var(--surface); stroke-width: 2; }
.nl-p { font-size: 10px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; font-family: var(--body); }

/* 개념 설명 */
.learn { display: flex; flex-direction: column; gap: 14px; }
.learn-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.learn-head .kicker { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: .08em; color: var(--flag); }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); }
.dots i.seen { background: var(--line); }
.dots i.on { background: var(--accent); border-color: var(--accent); }
.learn-body { font-size: 18px; line-height: 1.75; word-break: keep-all; overflow-x: auto; }
.learn-body p { margin: 0 0 10px; }
.learn-body .aside { font-size: 15px; color: var(--muted); background: var(--paper); border-radius: 10px; padding: 8px 12px; }
.learn-body .big { text-align: center; font-size: 1.15em; margin: 6px 0 12px; overflow-x: auto; }
.learn-nav { display: flex; justify-content: space-between; gap: 10px; }
.learn-nav .btn { min-width: 120px; }
.kw { font-weight: 700; padding: 0 4px; border-radius: 5px; white-space: nowrap; }
.kw.dx { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.kw.ds { background: color-mix(in srgb, var(--flag) 18%, transparent); color: var(--flag); }
table.cmp { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-bottom: 6px; }
table.cmp th { text-align: left; vertical-align: top; padding: 10px 12px; background: var(--paper); border-radius: 10px 0 0 10px; width: 9em; font-size: 16px; }
table.cmp td { padding: 10px 12px; background: var(--paper); border-radius: 0 10px 10px 0; font-size: 16px; line-height: 1.7; }
.flow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 6px 0 12px; }
.flow span { border: 2px solid var(--accent); border-radius: 12px; padding: 6px 14px; font-weight: 700; background: var(--surface); }
.flow b { color: var(--accent); }
.flow.back span { border-color: var(--flag); } .flow.back b { color: var(--flag); }
ol.how3 { margin: 0 0 12px; padding-left: 1.4em; } ol.how3 li { margin-bottom: 6px; }

/* 움직임 그림 */
.mw { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; background: var(--surface); }

.mw-line svg, .mw-graph svg { width: 100%; height: auto; display: block; }
.mw-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.mw-st { background: var(--paper); border-radius: 10px; padding: 8px 12px; }
.mw-st small { display: block; font-size: 13px; font-weight: 700; color: var(--muted); }
.mw-st b { font-family: var(--display); font-weight: 400; font-size: 26px; font-variant-numeric: tabular-nums; }
.mw-st.dx b { color: var(--accent); } .mw-st.ds b { color: var(--flag); }
.mw-ctl { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mw-ctl input[type=range] { flex: 1 1 180px; min-width: 0; height: 44px; accent-color: var(--flag); }
.mw-t { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 6.5em; }

/* 관리자: 오개념 */
.tag { display: inline-block; font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); margin: 1px 0; }

/* 소문제(①②③) 화면: 소문제마다 색이 바뀌고, 넘어갈 때 새 카드가 들어온다 */
.now { border-top: 6px solid var(--sc, var(--accent)); }
.stepper { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; }
.stepper li { flex: 1 1 0; display: flex; align-items: center; min-width: 0; }
.stepper li:last-child { flex: 0 0 auto; }
.stepper li::after { content: ""; flex: 1 1 auto; height: 3px; margin: 0 6px; border-radius: 2px; background: var(--line); }
.stepper li.done::after { background: var(--good); }
.stepper li:last-child::after { display: none; }
.stepper span { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 17px; border: 2px solid var(--line); color: var(--muted); background: var(--surface); transition: transform .3s; }
.stepper .done span { background: var(--good); border-color: var(--good); color: #FFFFFF; }
.stepper .cur span { width: 44px; height: 44px; font-size: 22px; background: var(--sc); border-color: var(--sc); color: #FFFFFF; box-shadow: 0 0 0 4px color-mix(in srgb, var(--sc) 22%, transparent); }
.passbar { background: var(--good-soft); border: 1.5px solid var(--good); color: var(--good); border-radius: 12px; padding: 10px 14px; font-size: 17px; }
.passbar b { font-weight: 700; }
.subq { display: flex; flex-direction: column; gap: 12px; border: 2px solid var(--sc); border-radius: 14px; padding: 14px; background: color-mix(in srgb, var(--sc) 6%, var(--surface)); }
.subq-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.subq-n { font-family: var(--display); font-size: 34px; line-height: 1; color: var(--sc); }
.subq-of { font-weight: 700; color: var(--sc); font-size: 15px; letter-spacing: .04em; }
.subq-head .tries { margin-left: auto; }
.subq .prompt { font-size: 20px; line-height: 1.55; word-break: keep-all; }
.subq.enter { animation: subqIn .55s cubic-bezier(.2, .8, .3, 1.1); }
@keyframes subqIn { 0% { transform: translateX(46px); opacity: 0; box-shadow: 0 0 0 0 var(--sc); } 60% { opacity: 1; box-shadow: 0 0 0 8px color-mix(in srgb, var(--sc) 25%, transparent); } 100% { transform: none; box-shadow: 0 0 0 0 transparent; } }
.logline { border-left: 5px solid var(--sc, var(--good)); }
.logline i { color: var(--sc, var(--good)); font-size: 18px; }
.logline .cap { display: block; font-size: 13px; color: var(--muted); font-weight: 700; line-height: 1.4; margin-bottom: 2px; }
@media (prefers-reduced-motion: reduce) { .subq.enter { animation: none; } }

/* 관리자: 학생 답안 */
.ans { display: flex; flex-direction: column; gap: 10px; border: 2px solid var(--accent); border-radius: 14px; padding: 14px; scroll-margin-top: 12px; }
.ans-card { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--surface); }
.ans-card summary { cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 40px; }
.ans-card summary small { color: var(--muted); font-size: 13px; }
.ans-card .q { font-size: 16px; line-height: 1.8; padding: 6px 0; }
.ans-q { margin-top: 8px; font-weight: 700; font-size: 14px; color: var(--sc); display: flex; gap: 6px; }
.ans-q i { font-style: normal; }
.ans-a { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; align-items: center; padding: 4px 10px; border-radius: 8px; margin-top: 3px; font-size: 15px; overflow-x: auto; }
.ans-a.ok { background: var(--good-soft); } .ans-a.ok b { color: var(--good); }
.ans-a.no { background: var(--bad-soft); } .ans-a.no b { color: var(--bad); }
.ans-a .bad { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; }
.ans-reset { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--flag); border-top: 1.5px dashed var(--flag); padding-top: 6px; }

<script>
/* 위치의 변화량과 움직인 거리 — 단계, 개념 설명, 문제 데이터
   ─ 선택지(o)는 첫 번째가 정답이며 화면에서 섞어 보여 준다. "T:"로 시작하면 글, 아니면 수식.
   ─ 수 입력 칸 f = [이름표(수식), 정답, 함정] . 함정 = { "오답값": [오개념 이름표, 안내 문구] }
   ─ variants 가 있는 문제는 학번에 따라 숫자가 달라진다(판본끼리 단계 수와 함정 구조가 같다).
   ─ 문항에는 테마 낱말(정류장, 버스 노선)을 넣지 않는다. 테마는 app.js 에서만 입힌다. */
(function () {
  /* 오개념 이름표: 관리자 화면에서 이 이름으로 모아 보여 준다 */
  window.MIS = {
    pos: "위치와 위치의 변화량 혼동",
    dist: "위치의 변화량과 움직인 거리 혼동",
    sign: "음의 속도(뒤로 간 것)를 처리하지 못함",
    stop: "속도가 0인 순간(방향이 바뀌는 순간)을 못 찾음",
    split: "방향이 바뀌는 시각에서 구간을 나누지 않음",
    start: "처음 위치를 빠뜨림",
    order: "빼는 순서를 거꾸로 함",
    diff: "미분과 적분의 방향 혼동",
    ftc: "정적분 = 부정적분의 차이를 적용하지 못함",
    calc: "부정적분·미분 계산 실수",
    half: "삼각형 넓이에서 ½을 빠뜨림"
  };

  var D = function (t) { return "\\(\\displaystyle " + t + "\\)"; };
  var m = function (t) { return "\\(" + t + "\\)"; };
  /* 분수 문자열("7/3")을 TeX 로 */
  function tx(v) {
    var s = String(v), neg = s.charAt(0) === "-", b = neg ? s.slice(1) : s, k = b.indexOf("/");
    return (neg ? "-" : "") + (k < 0 ? b : "\\tfrac{" + b.slice(0, k) + "}{" + b.slice(k + 1) + "}");
  }
  /* 함정 목록을 만든다. 정답과 같은 값, 이미 넣은 값은 건너뛴다 */
  function traps(ans, list) {
    var o = {};
    list.forEach(function (t) { var k = String(t[0]); if (k !== String(ans) && !o[k]) o[k] = [t[1], t[2]]; });
    return o;
  }
  /* 다항식 계수 [c0, c1, c2 …] 를 TeX 로 (변수 t) */
  function poly(c) {
    var s = "";
    for (var i = c.length - 1; i >= 0; i--) {
      var a = c[i]; if (!a) continue;
      var abs = Math.abs(a), sg = a < 0 ? "-" : s ? "+" : "";
      s += sg + (i === 0 ? abs : (abs === 1 ? "" : abs) + (i === 1 ? "t" : "t^{" + i + "}"));
    }
    return s || "0";
  }

  var ASK_AREA = "그래프의 위쪽(속도 +)과 아래쪽(속도 −)을 나누어 보았나요? 넓이 자체는 항상 양수로 셉니다.";
  var ASK_F = "고른 식을 미분해 보세요. 처음의 속도 \\(v(t)\\)가 나오나요?";
  var ASK_SUB = "\\(t\\) 자리에 수를 넣을 때 거듭제곱부터 계산했나요? 분수는 통분해서 계산합니다.";

  /* ───────── 1단계: 왜 배울까? ───────── */
  function M1(a, b, c) {
    var dx = c - a, d = Math.abs(b - a) + Math.abs(c - b);
    return { text: "수직선 위의 점 P가 " + m(a) + "에서 출발하여 " + m(b) + "까지 갔다가, 방향을 바꾸어 " + m(c) + "까지 돌아왔습니다.",
      fig: { line: [a, b, c] }, steps: [
        { t: "nums", p: "① 처음 위치와 나중 위치를 쓰세요.",
          f: [["\\text{처음 위치}", String(a)], ["\\text{나중 위치}", String(c), traps(c, [[b, "pos", "가장 멀리 간 곳이 아니라, 마지막에 도착한 곳이 나중 위치입니다."]])]],
          h: "출발한 곳이 처음 위치, 맨 마지막에 멈춘 곳이 나중 위치입니다.", ask: "그림에서 화살표가 시작하는 곳과 끝나는 곳을 손가락으로 짚어 보세요." },
        { t: "nums", p: "② 위치의 변화량을 구하세요.",
          f: [["\\text{위치의 변화량}", String(dx), traps(dx, [[c, "pos", "나중 위치를 그대로 썼습니다. 처음 위치에서 얼마나 달라졌는지를 구합니다."], [-dx, "order", "처음 위치에서 나중 위치를 뺐습니다. 순서가 거꾸로입니다."], [d, "dist", "그것은 실제로 움직인 길이(움직인 거리)입니다. 위치의 변화량은 처음과 나중만 봅니다."]])]],
          h: "위치의 변화량 = (나중 위치) − (처음 위치)", ask: "중간에 어디를 다녀왔는지는 잊고, 처음과 나중 두 점만 보세요." },
        { t: "nums", p: "③ 움직인 거리를 구하세요.",
          f: [["\\text{움직인 거리}", String(d), traps(d, [[dx, "dist", "그것은 위치의 변화량입니다. 되돌아온 길도 움직인 거리에 넣어야 합니다."], [Math.abs(b - a), "split", "갈 때 움직인 거리만 셌습니다. 돌아올 때 움직인 거리도 더하세요."], [Math.abs(c - b), "split", "돌아올 때 움직인 거리만 셌습니다. 갈 때 움직인 거리도 더하세요."]])]],
          h: "갈 때 움직인 길이와 돌아올 때 움직인 길이를 각각 구해 더합니다.", ask: "화살표 두 개의 길이를 각각 재어 보세요." }
      ] };
  }
  function M2(go, back) {
    var dx = go - back, d = go + back;
    return { text: "동서로 뻗은 직선 도로에서 동쪽을 양의 방향으로 정합니다. 버스가 " + m(0) + "에서 출발하여 동쪽으로 " + m(go + "\\text{ km}") + "를 간 뒤, 서쪽으로 " + m(back + "\\text{ km}") + "를 갔습니다.",
      fig: { line: [0, go, dx] }, steps: [
        { t: "choice", p: "① 이 버스의 위치의 변화량은 음수입니다. 위치의 변화량이 음수라는 것은 무슨 뜻일까요?",
          o: ["T:버스가 처음 위치보다 음의 방향(서쪽)에 있다.", "T:버스가 점점 느려졌다.", "T:버스가 움직인 거리가 줄어들었다.", "T:계산이 틀렸다. 위치의 변화량은 항상 양수이다."],
          w: [null, "빠르기와는 관계가 없습니다. 위치의 변화량의 부호는 ‘어느 쪽에 있는가’를 알려 줍니다.", "움직인 거리는 줄어들지 않습니다. 움직일수록 계속 늘어납니다.", "위치의 변화량은 방향을 담고 있어서 음수가 될 수 있습니다."],
          tg: [null, "sign", "dist", "sign"],
          h: "처음 위치가 0이고 위치의 변화량이 음수이면, 나중 위치는 0보다 왼쪽(음의 방향)입니다.", ask: "그림에서 버스가 마지막에 0의 왼쪽에 있나요, 오른쪽에 있나요?" },
        { t: "nums", p: "② 위치의 변화량을 구하세요. (단위 km)",
          f: [["\\text{위치의 변화량}", String(dx), traps(dx, [[-dx, "sign", "방향을 생각하지 않았습니다. 서쪽은 음의 방향입니다."], [d, "dist", "그것은 움직인 거리입니다. 위치의 변화량은 처음과 나중만 봅니다."]])]],
          h: "동쪽으로 간 것은 +, 서쪽으로 간 것은 −로 계산해 모두 더합니다.", ask: "+" + go + "와 −" + back + "를 더하면 얼마인가요?" },
        { t: "nums", p: "③ 움직인 거리를 구하세요. (단위 km)",
          f: [["\\text{움직인 거리}", String(d), traps(d, [[-dx, "dist", "위치의 변화량의 크기만 구했습니다. 실제로 달린 길이를 모두 더하세요."], [dx, "dist", "그것은 위치의 변화량입니다. 움직인 거리는 음수가 될 수 없습니다."]])]],
          h: "방향과 관계없이 달린 길이를 모두 더합니다.", ask: "자동차 계기판의 주행 거리는 뒤로 가면 줄어드나요?" }
      ] };
  }

  /* ───────── 2단계: 미분과 적분의 관계 ───────── */
  function R1(a, b) {
    var x2 = 2 * a - 4 * b;
    return { text: "직선 경로를 달리던 자율 주행 버스가 제동한 지 " + m("t") + "초 후의 위치가 " + m("x(t)=" + a + "t-" + b + "t^{2}") + " (m)입니다. " + m("(0\\le t\\le 2)") + " <small>(교과서 생각 열기)</small>",
      steps: [
        { t: "choice", p: "① 위치 \\(x(t)\\)를 \\(t\\)에 대하여 미분하면 무엇이 될까요?",
          o: ["T:속도 \\(v(t)\\)", "T:움직인 거리", "T:위치의 변화량", "T:처음 위치"],
          w: [null, "움직인 거리는 속도를 ‘적분’해서 구하는 양입니다. 미분 쪽이 아닙니다.", "위치의 변화량은 속도를 ‘적분’해서 구합니다. 미분하면 무엇이 되는지 떠올려 보세요.", "처음 위치는 \\(t=0\\)을 넣은 값입니다. 미분과는 다릅니다."],
          tg: [null, "diff", "diff", "pos"],
          h: "위치를 미분하면 속도, 속도를 미분하면 가속도입니다. (미적분Ⅰ 미분 단원)", ask: "1초 동안 위치가 얼마나 변하는지를 나타내는 양은 무엇인가요?" },
        { t: "nums", p: "② 속도를 구하세요. 빈칸에 알맞은 수를 씁니다.", show: "v(t)=x'(t)=(가)-(나)t", full: "v(t)=x'(t)=" + a + "-" + 2 * b + "t",
          f: [["\\text{(가)}", String(a)], ["\\text{(나)}", String(2 * b), traps(2 * b, [[b, "calc", "\\(t^{2}\\)을 미분하면 \\(2t\\)입니다. 지수 2를 앞으로 내려 곱하세요."]])]],
          h: "\\(at\\)를 미분하면 \\(a\\), \\(bt^{2}\\)을 미분하면 \\(2bt\\)입니다.", ask: "\\(t^{2}\\)을 미분하면 무엇이었나요?" },
        { t: "choice", p: "③ \\(x(t)\\)는 \\(v(t)\\)의 한 부정적분입니다. 정적분 \\(\\int_{0}^{2}v(t)\\,dt\\)를 \\(x(t)\\)로 나타낸 것을 고르세요.",
          o: ["\\int_{0}^{2}v(t)\\,dt=x(2)-x(0)", "\\int_{0}^{2}v(t)\\,dt=x(0)-x(2)", "\\int_{0}^{2}v(t)\\,dt=x(2)+x(0)", "\\int_{0}^{2}v(t)\\,dt=v(2)-v(0)"],
          w: [null, "위끝을 넣은 값에서 아래끝을 넣은 값을 뺍니다. 순서가 거꾸로입니다.", "정적분은 부정적분의 ‘차이’입니다. 더하지 않습니다.", "\\(v\\)의 부정적분은 \\(v\\)가 아니라 \\(x\\)입니다. 적분 기호 안의 함수에 대입하는 것이 아닙니다."],
          tg: [null, "order", "ftc", "ftc"],
          h: "\\(F(t)\\)가 \\(f(t)\\)의 한 부정적분이면 \\(\\int_{a}^{b}f(t)\\,dt=F(b)-F(a)\\)입니다.", ask: "정적분은 부정적분에 무엇을 넣은 값에서 무엇을 넣은 값을 빼는 것이었나요?" },
        { t: "nums", p: "④ 값을 계산하세요.", show: "\\int_{0}^{2}v(t)\\,dt=x(2)-x(0)=(가)-(나)=(다)", full: "\\int_{0}^{2}v(t)\\,dt=x(2)-x(0)=" + x2 + "-0=" + x2,
          f: [["\\text{(가)}", String(x2)], ["\\text{(나)}", "0"], ["\\text{(다)}", String(x2)]],
          h: "\\(x(2)=" + a + "\\times2-" + b + "\\times2^{2}\\), \\(x(0)=0\\)입니다.", ask: ASK_SUB }
      ] };
  }

  /* ───────── 3단계: 속도를 적분하면 위치의 변화량 ───────── */
  function P1(v1, v2) {
    var A1 = 2 * v1, A2 = -2 * v2, dx = A1 - A2;
    return { text: "수직선 위를 움직이는 점 P의 속도 " + m("v(t)") + "의 그래프입니다. 처음 2초 동안은 속도가 " + m(v1) + ", 다음 2초 동안은 " + m(v2) + "입니다. 시각 " + m("t=0") + "에서 " + m("t=4") + "까지 점 P의 위치의 변화량을 구하세요.",
      fig: { pc: [[0, 2, v1], [2, 4, v2]], t1: 4 }, steps: [
        { t: "nums", p: "① 그래프와 \\(t\\)축 사이의 넓이를 각각 구하세요. (넓이는 양수)",
          f: [["\\text{위쪽 넓이 }(0\\le t\\le 2)", String(A1)], ["\\text{아래쪽 넓이 }(2\\le t\\le 4)", String(A2), traps(A2, [[-A2, "sign", "넓이는 양수로 씁니다. 부호(뒤로 갔다는 것)는 다음 줄에서 생각합니다."]])]],
          h: "직사각형의 넓이 = 가로 × 세로. 가로는 시간 2초, 세로는 속도의 크기입니다.", ask: ASK_AREA },
        { t: "choice", p: "② 위치의 변화량을 구하는 식을 고르세요.",
          o: [A1 + "-" + A2, A1 + "+" + A2, A2 + "-" + A1, A1 + "\\times" + A2],
          w: [null, "더하면 움직인 거리입니다. 속도가 음수인 동안은 뒤로 갔으므로 위치는 그만큼 줄어듭니다.", "앞으로 간 만큼에서 뒤로 간 만큼을 빼야 합니다. 순서가 거꾸로입니다.", "넓이를 곱하는 것이 아닙니다. 앞으로 간 만큼과 뒤로 간 만큼을 생각하세요."],
          tg: [null, "sign", "order", "ftc"],
          h: "\\(t\\)축 위쪽 넓이는 앞으로 간 만큼(+), 아래쪽 넓이는 뒤로 간 만큼(−)입니다.", ask: "속도가 음수인 2초 동안 점 P는 어느 쪽으로 움직였나요?" },
        { t: "nums", p: "③ 위치의 변화량을 구하세요.",
          f: [["\\int_{0}^{4}v(t)\\,dt", String(dx), traps(dx, [[A1 + A2, "sign", "뒤로 간 만큼을 더했습니다. 위치의 변화량에서는 빼야 합니다."]])]],
          h: "(위쪽 넓이) − (아래쪽 넓이)", ask: "②에서 고른 식을 그대로 계산해 보세요." }
      ] };
  }
  function P2(a, b, T, x0) {
    var area = a * T / 2, fin = x0 + area;
    return { text: "점 P의 시각 " + m("t") + "에서의 속도가 " + m("v(t)=" + a + "-" + (b === 1 ? "" : b) + "t") + " " + m("(0\\le t\\le " + T + ")") + "이고, 시각 " + m("t=0") + "에서 점 P의 위치는 " + m(x0) + "입니다.",
      fig: { poly: [a, -b], t1: T }, steps: [
        { t: "nums", p: "① 그래프와 \\(t\\)축이 만드는 삼각형의 밑변과 높이를 쓰세요.",
          f: [["\\text{밑변}", String(T)], ["\\text{높이}=v(0)", String(a)]],
          h: "밑변은 \\(t=0\\)부터 \\(t=" + T + "\\)까지의 시간, 높이는 \\(t=0\\)일 때의 속도입니다.", ask: "그래프가 \\(t\\)축과 만나는 곳과 \\(v\\)축과 만나는 곳을 찾아보세요." },
        { t: "nums", p: "② \\(t=0\\)부터 \\(t=" + T + "\\)까지 위치의 변화량을 구하세요.",
          f: [["\\int_{0}^{" + T + "}v(t)\\,dt", String(area), traps(area, [[a * T, "half", "삼각형의 넓이는 (밑변) × (높이)에 \\(\\tfrac{1}{2}\\)을 곱합니다."]])]],
          h: "삼각형의 넓이 = \\(\\tfrac{1}{2}\\) × 밑변 × 높이", ask: "삼각형 넓이 공식을 떠올려 보세요." },
        { t: "choice", p: "③ 시각 \\(t=" + T + "\\)에서 점 P의 위치를 구하는 식을 고르세요.",
          o: [x0 + "+" + area, String(area), area + "-" + x0, String(x0)],
          w: [null, "그것은 위치의 변화량입니다. 점 P는 0이 아니라 \\(" + x0 + "\\)에서 출발했습니다.", "처음 위치를 빼는 것이 아니라, 처음 위치에 위치의 변화량을 더합니다.", "처음 위치 그대로입니다. 그동안 움직인 것이 반영되지 않았습니다."],
          tg: [null, "start", "start", "pos"],

<script>
(function () {

  var SUMMIT = -1, BONUSES = [];
  CAMPS.forEach(function (c, ci) { if (c.bonus) BONUSES.push(ci); else SUMMIT = ci; });

  /* 서버 설정의 기본값. limC = 선택형 기회, limN = 입력형 기회, wait = 오답 뒤 제출을 막는 시간(초), vary = 학생마다 다른 숫자 */

  function fresh(name) { return { name: name || "", start: 0, end: 0, probs: {}, cele: {}, learn: {}, note: {}, rev: 0, synced: false, outbox: [], view: "intro", cur: null }; }

  try { var sv = JSON.parse(localStorage.getItem(KEY) || "null"); if (sv && sv.probs) S = sv; } catch (e) {}

  }

  function freshUi() { return { order: null, vals: [], active: 0, ok: [], no: [], fb: null, busy: false, fresh: false, page: 0 }; }

  function parse(s) {

  }

  /* 학번과 문항 이름표로 판본 번호를 정한다. 같은 학생·같은 문항이면 언제나 같은 값 */

  /* 문항을 쓰는 모든 곳은 이 함수를 거친다: 그 학생의 판본(숫자)을 입힌 문항 */

  function stages(c) { return c.tiers.map(function (t) { return { label: t.label, list: t.ids.map(function (id) { return BYID[id]; }) }; }); }
  function stageDone(sg) { return sg.list.some(isDone); }

  /* 마지막 단계는 문제에 더해 마지막 확인(핵심 정리 빈칸)까지 통과해야 한다 */

  function unlocked(ci) { return CAMPS[ci].bonus ? passed(SUMMIT) : ci === 0 || passed(ci - 1); }

  }

    return '<div class="bar"><div>' + (back ? '<button class="btn small" data-act="map">← 학습 지도</button>' : '<span class="who">' + esc(S.name) + "</span>") +
      '</div><div class="right"><span class="sync' + (syncState === "bad" ? " bad" : "") + '">' + syncText() + '</span><span class="total">' + total() + "점</span>" +
      (S.view !== "record" ? '<button class="btn small" data-act="record">학습 기록</button>' : "") + "</div></div>";
  }

  /* ====================================================================

  function velFn(w) {

  function vtSvg(w, tNow, cursor) {

  function vMap() {

      var status = ok ? "통과" : open ? (c.bonus ? "선택" : ci === SUMMIT && probsPassed(ci) ? "마지막 확인" : lr ? "문제 푸는 중" : "개념 배우기") : "잠김";

        h += '<p class="tip">' + c.tip + "</p>";

            '<p class="tip">개념을 먼저 넘겨 보면 문제가 열립니다.</p>';
        } else {
          h += '<div class="row-btns"><button class="btn small learn-btn" data-learn="' + c.key + '">개념 다시 보기</button>' +

            (exOpen[ci] ? '<div class="ex"><b>예시</b>' + M(c.ex) + "</div>" : "") +

              '<button class="route' + (S.final.done ? " done" : ready ? " going" : "") + '" data-act="final"' + (ready ? "" : " disabled") + "><b>핵심 정리 빈칸</b><span>" + (S.final.done ? "통과" : nOk + " / " + MAIN) + "</span></button></div></div>";

  /* ---------- 개념 설명 ---------- */

  /* ---------- 문제 화면 ---------- */
  /* 소문제마다 색을 달리해 ①②③이 서로 다른 문제로 보이게 한다(진행 막대, 문제 카드, 내 풀이에 같은 색) */
  var SC = ["#0F6B78", "#D2541B", "#1B7F4A", "#7A4FB0", "#B07A00", "#B0336B"];
  function sc(k) { return "--sc:" + SC[k % SC.length]; }
  function stripMark(t) { return String(t || "").replace(/^[①-⑩]\s*/, ""); }
  function logHtml(s, markNew, p) {
    return s.log.map(function (l, k) {
      var body = l.k === "m" ? M(l.v) : l.v, cap = p && p.steps[k] ? '<small class="cap">' + stripMark(p.steps[k].p) + "</small>" : "";

    }).join("");
  }
  /* 소문제 진행 막대: 지난 소문제는 ✓, 지금 소문제는 크게, 남은 소문제는 흐리게 */
  function stepperHtml(p, s) {
    return '<ol class="stepper" aria-label="소문제 ' + (s.step + 1) + " / " + p.steps.length + '">' + p.steps.map(function (_, k) {
      var cls = k < s.step ? "done" : k === s.step ? "cur" : "todo";
      return '<li class="' + cls + '" style="' + sc(k) + '"><span>' + (cls === "done" ? "✓" : k + 1) + "</span></li>";
    }).join("") + "</ol>";
  }
  /* 틀렸을 때 답을 알려 주는 대신, 스스로 확인할 방법을 묻는다 */
  function askOf(p, k) {
    var step = p.steps[k];
    if (step.ask) return step.ask;
    if (step.t === "choice") return "각 선택지를 문제의 그림과 비교해 보세요. 어느 것이 그림과 맞나요?";

  function nextHtml(p, s) {
    var c = CAMPS[p.camp], sts = stages(c), k = -1, h = '<div class="done-box"><b>완료 +' + s.score + "점</b>";

    if (k >= 0) {
      var sg = sts[k];
      h += "<p>다음은 <b>" + sg.label + "</b>입니다. " + (sg.list.length > 1 ? "풀 문제를 하나 고르세요." : "이 문제를 풀면 " + (p.camp === SUMMIT ? "마지막 확인이 열립니다." : c.name + "를 통과합니다.")) + '</p><div class="routes">' +
        sg.list.map(function (q) { return routeBtn(q, false); }).join("") + "</div>";
    } else if (p.camp === SUMMIT && !S.final.done) {
      h += '<p>문제를 모두 풀었습니다. 이제 마지막 확인에서 단계마다 적어 둔 핵심 정리를 다시 씁니다.</p><div><button class="btn primary" data-act="final">마지막 확인 하기</button></div>';
    } else h += "<p>" + (c.bonus ? "보너스 문제를 풀었습니다. 남은 문제에도 도전해 보세요." : "이 단계를 통과했습니다.") + "</p>";
    return h + '<div><button class="btn small" data-act="map">학습 지도 보기</button></div></div>';
  }
  function vProb() {
    var p = view(BYID[S.cur]), s = st(p.id), c = CAMPS[p.camp];
    var left = '<div class="card"><div class="meta"><span>' + c.name + " · " + c.topic + " · " + esc(p.road) + "</span>" +
      '<span class="miss">' + (s.miss ? "틀린 횟수 " + s.miss + "회" : "") + "</span></div>" + qHtml(p) +
      (s.log.length ? '<div class="log"><h3>푼 소문제</h3>' + logHtml(s, ui.fresh, p) + "</div>" : "") + "</div>";
    var right;
    if (s.done) {
      right = nextHtml(p, s);
    } else if (s.fail) {
      var fs = p.steps[s.step];
      right = '<div class="fail-box"><b>기회 ' + lim(fs) + "번을 모두 썼습니다</b><p>괜찮습니다. 아래 내용을 다시 읽고, " + (p.variants && CFG.vary ? "숫자가 바뀐 같은 유형의 문제를" : "이 문제를") + " 처음부터 다시 풀어 보세요. 점수는 깎이지 않습니다.</p>" +
        '<div class="hintbox"><b>이 단계의 핵심</b><p>' + c.tip + "</p><p>" + M(c.ex) + "</p><p><b class=\"hl\">막힌 줄의 힌트</b>" + fs.h + "</p></div>" +
        '<div class="row"><button class="btn primary" data-act="restart">처음부터 다시 풀기</button><button class="btn" data-learn="' + c.key + '">개념 다시 보기</button></div></div>';
    } else {
      var step = p.steps[s.step], L = lim(step), dots = "";
      for (var di = 0; di < L; di++) dots += '<i class="' + (di < L - s.tries ? "" : "used") + '"></i>';
      var justMoved = ui.moved && s.step > 0 && !(ui.fb && ui.fb[0] === "no");
      right = '<div class="card now" style="' + sc(s.step) + '">' + stepperHtml(p, s) +
        (justMoved ? '<div class="passbar" role="status"><b>✓ ' + MARK[s.step - 1] + "번 정답!</b> 이제 <b>" + MARK[s.step] + "번 문제</b>입니다.</div>" : "") +
        '<div class="subq' + (justMoved && ui.fresh ? " enter" : "") + '"><div class="subq-head"><span class="subq-n">' + MARK[s.step] + '</span><span class="subq-of">소문제 ' + (s.step + 1) + " / " + p.steps.length + "</span>" +
        '<span class="tries" aria-label="남은 기회 ' + (L - s.tries) + '번">남은 기회 ' + dots + '</span></div><p class="prompt">' + stripMark(step.p) + "</p>";
      if (step.t === "choice") {
        if (!ui.order) ui.order = shuffle(step.o.length);
        right += '<div class="opts">' + ui.order.map(function (i) {
          var w = s.wrong.indexOf(i) >= 0;
          return '<button class="opt' + (step.o[i].indexOf("T:") === 0 ? " t" : "") + (w ? " wrong" : "") + '" data-lockable data-opt="' + i + '"' + (w ? ' data-off="1" disabled' : "") + ">" + optHtml(step.o[i]) + "</button>";
        }).join("") + "</div>";
      } else {
        if (step.show) right += '<div class="formula">' + M(step.show.replace(/\((가|나|다)\)/g, "\\boxed{\\text{($1)}}")) + "</div>";
        right += '<div class="fields' + (step.show ? " few" : "") + '">' + step.f.map(function (f, i) {
          var cls = ui.ok[i] ? " ok" : ui.no[i] ? " no" : i === ui.active ? " active" : "";
          return '<button class="field' + cls + '" data-field="' + i + '"><span>' + M(f[0] + " =") + '</span><span class="val">' + esc(ui.vals[i] || "") + "</span></button>";
        }).join("") + "</div>" +
          '<div class="pad">' + ["7", "8", "9", "⌫", "4", "5", "6", "-", "1", "2", "3", "/"].map(function (k) {
            return '<button class="key" data-key="' + k + '" aria-label="' + (k === "⌫" ? "지우기" : k === "-" ? "음수 부호" : k === "/" ? "분수 기호" : k) + '">' + (k === "-" ? "−" : k) + "</button>";
          }).join("") + '<button class="key" data-key="0">0</button><button class="key go" data-key="go" data-lockable data-label="확인">확인</button></div>' +
          '<p class="hint">분수는 4/3, 음수는 −4처럼 입력합니다.</p>';
      }
      right += '<p class="fb ' + (ui.fb ? ui.fb[0] : "") + '" role="status">' + (ui.fb ? ui.fb[1] : "") + '</p><p class="wait" data-wait role="status"></p>';
      if (s.hint) right += '<div class="hintbox"><b>다시 생각해 보기</b>' + (s.why ? '<p><b class="hl">방금 답</b>' + s.why + "</p>" : "") + "<p>" + askOf(p, s.step) + "</p>" +
        (s.hintOpen ? '<p><b class="hl">힌트</b>' + step.h + "</p>" : '<p><button class="btn small" data-act="hint">그래도 모르겠으면 힌트 보기</button></p>') + "</div>";

  function vRecord() {

      '<div class="sum"><div><small>통과한 단계</small><b>' + sm.stage + " / " + MAIN + "</b></div><div><small>총점</small><b>" + sm.score + "점</b></div>" +
      "<div><small>푼 문제</small><b>" + sm.done + "개</b></div><div><small>틀린 횟수</small><b>" + sm.miss + "회</b></div></div>";
    if (!sm.done) h += '<p class="empty">아직 푼 문제가 없습니다. 푼 문제의 풀이가 여기에 한 줄씩 기록됩니다.</p>';
    CAMPS.forEach(function (c) {
      c.probs.forEach(function (bp) {
        var s = S.probs[bp.id]; if (!s || !s.done) return;
        var p = view(bp);
        h += '<div class="rec"><div class="rec-head">' + c.name + " · " + c.topic + " · " + esc(p.road) + "<span>" + s.score + "점 · 틀린 횟수 " + s.miss + "회" + (s.hints ? " · 힌트 " + s.hints + "회" : "") +
          (s.resets ? " · 다시 풀기 " + s.resets + "회" : "") + "</span></div>" + '<div class="q text">' + p.text + "</div>" + logHtml(s, false, p) + "</div>";
      });

  /* ---------- 마지막 확인: 핵심 정리 빈칸 ---------- */
  var BL = ["(가)", "(나)"];
  function vFinal() {
    var f = S.final, h = bar(true) + '<div class="gate"><div class="card"><h2>마지막 확인</h2><p class="tip" style="margin-top:8px">단계마다 공책에 적어 둔 핵심 정리를 보고 빈칸을 채우세요. 모두 맞히면 오늘 학습이 끝납니다.</p></div>';
    for (var ci = 0; ci < MAIN; ci++) {
      var c = CAMPS[ci], n = NOTES[c.key], ok = !!f.ok[c.key], fb = gateFb[c.key], tr = f.tries[c.key] || 0, dots = "";
      for (var di = 0; di < CFG.limN; di++) dots += '<i class="' + (di < CFG.limN - tr ? "" : "used") + '"></i>';
      h += '<div class="card gate-item' + (ok ? " ok" : "") + '"><div class="gate-head"><span>' + c.name + " · " + c.topic + "</span>" +
        (ok ? '<span class="ok">✓ 통과</span>' : '<span class="tries">남은 기회 ' + dots + "</span>") + '</div><div class="formula">' +
        (ok ? n.full : n.quiz).map(function (l) { return "<div>" + l + "</div>"; }).join("") + "</div>";
      if (!ok) {
        h += '<div class="blanks">' + n.blanks.map(function (_, i) {
          var v = (f.vals[c.key] || [])[i] || "";
          return '<label for="bl' + c.key + i + '">' + BL[i] + '<input id="bl' + c.key + i + '" data-blank="' + c.key + ":" + i + '" maxlength="6" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="' + esc(v) + '"' +
            (fb && fb.bad && fb.bad[i] ? ' class="no"' : "") + "></label>";
        }).join("") + '<button class="btn primary" data-gate="' + c.key + '" data-lockable data-label="확인">확인</button></div>' +
          '<p class="fb no" role="status">' + (fb ? fb.msg : "") + '</p><p class="wait" data-wait role="status"></p>';
      }
      h += "</div>";
    }
    return h + "</div>";
  }
  function normBlank(v) { return String(v || "").trim().toLowerCase().replace(/[−–—ㅡ]/g, "-").replace(/＋/g, "+").replace(/\s/g, ""); }
  function checkGate(key) {
    if (lockLeft()) return;
    var f = S.final, n = NOTES[key], vals = f.vals[key] || [], bad = [], anyBad = false, empty = false;
    n.blanks.forEach(function (acc, i) { var v = normBlank(vals[i]); if (!v) empty = true; bad[i] = acc.indexOf(v) < 0; if (bad[i]) anyBad = true; });
    if (empty) { gateFb[key] = { msg: "빈칸을 모두 채운 뒤 확인을 누르세요.", bad: [] }; render(); return; }
    if (!anyBad) {
      f.ok[key] = true; delete gateFb[key]; dirty = true;
      if (gateOk() >= MAIN) {
        f.done = true; if (!S.end) S.end = Date.now();
        queueSave({ camp: "마지막 확인", id: "핵심 정리", ver: "", result: "통과", score: 0, miss: f.miss, work: "" });
        render(); setTimeout(function () { celebrate(SUMMIT); }, calm ? 0 : 400); return;
      }
      save(); render(); return;
    }
    f.miss++; f.tries[key] = (f.tries[key] || 0) + 1; dirty = true; startLock();
    f.msk = f.msk || {}; f.msk[key] = (f.msk[key] || 0) + 1;
    if (f.tries[key] >= CFG.limN) {
      f.tries[key] = 0; f.vals[key] = []; delete gateFb[key]; save(); render();
      showNote(BYKEY[key], true); return;
    }
    gateFb[key] = { msg: "틀렸습니다. 공책에서 ‘" + CAMPS[BYKEY[key]].name + "’ 정리를 찾아 다시 써 보세요.", bad: bad };
    save(); render();
  }

  /* ---------- 핵심 정리 팝업 ---------- */
  function checkNote() {
    if (document.querySelector(".note, .cele")) return;

  }

      '<div class="formula">' + n.full.map(function (l) { return "<div>" + l.replace(/\\boxed\{((?:[^{}]|\{[^{}]*\})*)\}/g, "$1") + "</div>"; }).join("") + "</div>" +
      '<p class="memo">' + (review ? "기회를 모두 썼습니다. 이 내용을 공책에 적은 뒤 닫고, 이 단계의 빈칸을 처음부터 다시 쓰세요." :
        "<b>지금 공책에 그대로 적어 두세요.</b> 마지막 확인에서 이 내용을 다시 묻습니다.") + "</p>" +
      '<label class="chk" for="noteChk"><input type="checkbox" id="noteChk"> 공책에 적었습니다</label>' +
      '<div><button class="btn primary" id="noteClose" disabled>닫기</button></div></div>';
    document.body.appendChild(d);
    var chk = d.querySelector("#noteChk"), btn = d.querySelector("#noteClose");
    chk.addEventListener("change", function () { btn.disabled = !chk.checked; });
    btn.addEventListener("click", function () {
      d.remove();

  }

  /* ====================================================================
     관리자 모드: 학급별·단계별 통과율, 학생 명단, 오개념 유형, 문항별 오답률
     ==================================================================== */
  var STAGES = CAMPS.slice(0, MAIN).map(function (c, ci) { return { name: c.name, sub: c.topic, get: function (s) { return s.c[ci]; } }; })
    .concat([{ name: "마지막 확인", sub: "핵심 정리 빈칸", get: function (s) { return s.f; } }])
    .concat(BONUSES.map(function (bi) { return { name: CAMPS[bi].name, sub: CAMPS[bi].topic, get: function (s) { return s.c[bi]; } }; }));

    sid = String(sid || "").replace(/\D/g, "");

  function adminLoad(pw) {
    adm.busy = true; adm.err = ""; render();
    var req = HAS ? call("apiAdmin", pw) : Promise.resolve({ ok: true, students: sampleData() });
    req.then(function (r) {
      adm.busy = false;
      if (!r || !r.ok) { adm.err = (r && r.error) || "불러오지 못했습니다."; if (!adm.data) adm.pw = ""; render(); return; }
      adm.pw = pw; adm.data = r.students || []; adm.sel = {}; adm.msg = ""; render();
    }).catch(function () { adm.busy = false; adm.err = "접속하지 못했습니다. 인터넷 연결을 확인하세요."; render(); });
  }

  function render() {
    var wide = (S.view === "prob" && BYID[S.cur]) || S.view === "admin";
    app.className = "wrap" + (wide ? " wide" : "");
    app.classList.toggle("intro-view", S.view === "intro");
    if (S.view === "learn" && !LEARN[S.cur]) S.view = "map";
    app.innerHTML = S.view === "admin" ? vAdmin() : S.view === "map" ? vMap() : S.view === "learn" ? vLearn() : S.view === "final" ? vFinal() : S.view === "prob" && BYID[S.cur] ? vProb() : S.view === "record" ? vRecord() : vIntro();
    if (S.view === "learn") mwBind(); else { stopPlay(); MW = null; }
    typeset(); applyLock();
    if (S.view === "prob") ui.fresh = false;                                  /* 들어오는 움직임은 한 번만(숫자를 누를 때마다 다시 움직이지 않게) */
    if (S.view === "prob" && !S.tutPad && app.querySelector(".pad")) setTimeout(maybeTour, 250);
  }

  /* ---------- 축하 장면 ---------- */
  function confetti(canvas, amount) {
    var ctx = canvas.getContext("2d"), dpr = Math.min(window.devicePixelRatio || 1, 2), W, H, t0 = 0, parts = [];
    function size() { W = canvas.clientWidth; H = canvas.clientHeight; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    size();
    var cols = ["#D2541B", "#0F6B78", "#F2B705", "#1B7F4A", "#FFFFFF", "#5CC4D3"];
    for (var i = 0; i < amount; i++) parts.push({ x: W / 2 + (Math.random() - .5) * W * .5, y: H * .45, vx: (Math.random() - .5) * 13, vy: -6 - Math.random() * 11,
      s: 6 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[i % cols.length] });
    function frame(t) {
      if (!canvas.isConnected) return;
      if (!t0) t0 = t; var el = t - t0;
      ctx.clearRect(0, 0, W, H);
      parts.forEach(function (p) {
        p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - el / 3200);
        ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
      });
      if (el < 3200) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  /* kind: "start" 또는 통과한 단계 번호 */
  function celebrate(kind) {
    var old = document.querySelector(".cele"); if (old) old.remove();
    var start = kind === "start", ci = start ? -1 : kind, c = start ? null : CAMPS[ci], bonus = !start && c.bonus;
    var from = start ? 0 : bonus ? MAIN : ci, to = start ? 0 : bonus ? MAIN + 1 : ci + 1;
    var title = start ? "출발!" : ci === SUMMIT ? "도착! 오늘 학습 완료" : bonus ? "보너스 완료!" : c.name + " 통과!";
    var sub = start ? MAIN + "단계를 차례로 지나 도착점까지 가 봅시다. 단계마다 개념을 먼저 보고 문제를 풉니다." :
      ci === SUMMIT ? "위치의 변화량과 움직인 거리를 모두 배웠습니다." + (BONUSES.length ? " 시간이 남으면 보너스 문제에 도전해 보세요." : "") :
      bonus ? "교과서 문제까지 해냈습니다. 대단합니다!" : "다음은 ‘" + CAMPS[ci + 1].topic + "’입니다.";
    var d = document.createElement("div");
    d.className = "cele"; d.setAttribute("role", "dialog"); d.setAttribute("aria-label", title);
    d.innerHTML = "<canvas></canvas><div class=\"cele-in\">" + routeSvg(start ? 0 : bonus ? MAIN : ci, from, false) +
      '<p class="kicker">' + esc(S.name) + "</p><h2>" + title + '</h2><p class="altnum">' + (start ? "0" : Math.min(to, MAIN)) + " / " + MAIN + ' 단계</p><p class="sub">' + sub + "</p>" +
      '<button class="btn primary" data-act="celeClose">' + (start ? "출발" : "계속하기") + "</button></div>";
    document.body.appendChild(d);
    d.querySelector("[data-act=celeClose]").addEventListener("click", function () { d.remove(); if (!start) go("map"); else maybeTour(); });
    setTimeout(function () {
      var bus = d.querySelector("#rtBus"); if (!bus) return;
      bus.style.transform = "translate(" + stopX(to) + "px," + (RT.Y - 13) + "px)";
      if (bonus) { var star = d.querySelector("#rtStar"); setTimeout(function () { if (star) star.setAttribute("class", "rt-star on pop"); }, calm ? 0 : 1100); }
      else if (to > from) {
        var seg = d.querySelector('[data-seg="' + (to - 1) + '"]'), nm = d.querySelector('[data-name="' + (to - 1) + '"]');
        setTimeout(function () { if (seg) seg.setAttribute("class", "rt-seg on"); if (nm) nm.setAttribute("class", "rt-name on"); }, calm ? 0 : 700);
      }
      if (!start && !calm) setTimeout(function () { if (d.isConnected) confetti(d.querySelector("canvas"), ci === SUMMIT || bonus ? 220 : 110); }, 900);
    }, calm ? 0 : 450);
    var b = d.querySelector(".btn"); if (b && b.focus) b.focus({ preventScroll: true });
  }

  /* ---------- 채점 ---------- */
  function plain(v) { return String(v).replace(/\\\(|\\\)|\\displaystyle ?|\\text\{([^}]*)\}|\\tfrac\{([^}]*)\}\{([^}]*)\}/g, function (m0, a, n, dd) { return a != null ? a : n != null ? n + "/" + dd : ""; }); }
  function workText(s) { return s.log.map(function (l, k) { return MARK[k] + " " + plain(l.v); }).join("\n"); }
  function advance(p, s, entry) {
    s.log.push(entry); s.step++; s.tries = 0; s.wrong = []; s.hint = false; s.hintOpen = false; s.why = "";
    ui = freshUi(); ui.fresh = true; ui.moved = true; dirty = true;
    if (s.step >= p.steps.length) {
      s.done = true; s.score = p.pts; ui.fb = null;                 /* 감점 없음: 틀린 횟수는 기록만 한다 */
      var ci = p.camp, ck = "c:" + CAMPS[ci].key, firstPass = probsPassed(ci) && !S.cele[ck];
      if (firstPass) S.cele[ck] = Date.now();
      queueSave({ camp: CAMPS[ci].name, id: p.id, ver: p.variants ? s.ver + 1 : "", result: "완료", score: s.score, miss: s.miss, work: workText(s) });
      render();
      if (firstPass && ci !== SUMMIT) setTimeout(function () { celebrate(ci); }, calm ? 0 : 500);
      else if (firstPass) setTimeout(checkNote, calm ? 0 : 500);
      return;
    }
    save(); render();
    var pb = app.querySelector(".passbar");                                   /* 새 소문제의 머리가 화면 밖이면 보이게 */
    if (pb && pb.scrollIntoView) pb.scrollIntoView({ block: "nearest", behavior: calm ? "auto" : "smooth" });
  }
  function tagIt(s, tag) { if (!tag) return; s.tg = s.tg || {}; s.tg[tag] = (s.tg[tag] || 0) + 1; }
  function missed(msg) {
    var s = st(S.cur), p = view(BYID[S.cur]);
    s.miss++; s.tries++; s.hint = true; ui.fb = ["no", msg]; ui.fresh = false; dirty = true; startLock();
    s.ms = s.ms || []; s.ms[s.step] = (s.ms[s.step] || 0) + 1;                      /* 줄별 오답 수(관리자 통계용) */
    if (s.tries >= lim(p.steps[s.step])) {
      s.fail = true;
      queueSave({ camp: CAMPS[p.camp].name, id: p.id, ver: p.variants ? s.ver + 1 : "", result: "기회 소진", score: 0, miss: s.miss, work: workText(s) });
    }
    save(); render();
    var el = app.querySelector(".now"); if (el) el.classList.add("shake");
  }
  /* 기회를 다 쓴 뒤 다시 풀기: 숫자가 다른 판본으로 바꿔 답을 외워 통과하지 않게 한다 */
  function restart() {
    var s = st(S.cur), p = BYID[S.cur];
    s.step = 0; s.log = []; s.tries = 0; s.wrong = []; s.hint = false; s.hintOpen = false; s.fail = false; s.why = ""; s.resets = (s.resets || 0) + 1;
    if (p.variants && CFG.vary) s.ver = (s.ver + 1) % p.variants.length;
    rec(s, { r: 1 });
    ui = freshUi(); dirty = true; save(); render(); window.scrollTo(0, 0);
  }
  /* 학생이 낸 답(맞은 답, 틀린 답 모두)을 차례대로 남긴다. 관리자 화면의 ‘답안 보기’에 쓴다.
     {k: 소문제 번호, o: 고른 선택지 | v: 입력한 값들, ok: 맞음, r: 다시 시작 표시, ver: 숫자 판본} */
  function rec(s, e) { s.att = s.att || []; if (s.att.length >= 80) return; if (s.ver != null) e.ver = s.ver; s.att.push(e); }
  function pickOpt(i) {
    if (lockLeft()) return;
    var p = view(BYID[S.cur]), s = st(p.id), step = p.steps[s.step], o = step.o[0];
    rec(s, i === 0 ? { k: s.step, o: 0, ok: 1 } : { k: s.step, o: i });
    if (i === 0) advance(p, s, o.indexOf("T:") === 0 ? { k: "t", v: o.slice(2) } : { k: "m", v: o });
    else {
      s.wrong.push(i); s.why = (step.w && step.w[i]) || "";
      s.wo = s.wo || {}; s.wo[s.step + ":" + i] = (s.wo[s.step + ":" + i] || 0) + 1;   /* 선택지별 오답 수 */
      tagIt(s, step.tg && step.tg[i]);
      missed("틀렸습니다. 아래 안내를 읽고 다시 골라 보세요.");
    }
  }
  function checkNums() {
    if (lockLeft()) return;
    var p = view(BYID[S.cur]), s = st(p.id), step = p.steps[s.step], empty = false, bad = false, why = "";
    step.f.forEach(function (f, i) { if (!ui.ok[i] && !ui.vals[i]) empty = true; });
    if (empty) { ui.fb = ["no", "빈칸을 모두 채운 뒤 확인을 누르세요."]; render(); return; }
    var badFmt = step.f.some(function (f, i) { return !ui.ok[i] && !parse(ui.vals[i]); });
    if (badFmt) { ui.fb = ["no", "입력 형식을 확인하세요. 예: 4/3, -4"]; render(); return; }   /* 형식이 틀린 입력은 오답으로 세지 않는다 */
    step.f.forEach(function (f, i) {
      if (ui.ok[i]) return;
      if (same(ui.vals[i], f[1])) { ui.ok[i] = true; ui.no[i] = false; return; }
      ui.no[i] = true; bad = true;
      var tr = f[2] || {};
      Object.keys(tr).forEach(function (k) { if (same(ui.vals[i], k) && !why) { why = tr[k][1]; tagIt(s, tr[k][0]); } });
    });
    rec(s, bad ? { k: s.step, v: step.f.map(function (_, i) { return String(ui.vals[i] || ""); }) } : { k: s.step, v: step.f.map(function (_, i) { return String(ui.vals[i] || ""); }), ok: 1 });
    if (bad) {
      ui.active = ui.no.indexOf(true); s.why = why;
      missed(why ? "틀렸습니다. 아래 안내를 읽고 빨간 칸을 다시 계산해 보세요." : "틀렸습니다. 빨간 칸을 다시 계산해 보세요."); return;
    }
    advance(p, s, { k: "m", v: step.full || step.f.map(function (f) { return f[0] + " = " + texNum(f[1]); }).join(",\\quad ") });
  }
  function pressKey(k) {
    var bp = BYID[S.cur]; if (!bp) return; var s = st(bp.id); if (s.done || s.fail) return;
    var p = view(bp), step = p.steps[s.step]; if (step.t !== "nums") return;
    if (k === "go") return checkNums();
    var i = ui.active;
    if (ui.ok[i]) { i = -1; step.f.forEach(function (_, j) { if (i < 0 && !ui.ok[j]) i = j; }); if (i < 0) return; ui.active = i; }
    var v = ui.vals[i] || "";
    if (ui.no[i]) { ui.no[i] = false; if (k !== "⌫") v = ""; }
    if (k === "⌫") v = v.slice(0, -1);
    else if (k === "-") v = v.charAt(0) === "-" ? v.slice(1) : "-" + v;
    else if (k === "/") { if (v && v !== "-" && v.indexOf("/") < 0) v += "/"; }
    else if (v.length < 8) v += k;
    ui.vals[i] = v; ui.fb = null; render();
  }

  /* ---------- 입장 ---------- */
  function join() {
    var sid = document.getElementById("idInput").value.replace(/\D/g, ""), sname = document.getElementById("nameInput").value.replace(/\s+/g, " ").trim();
    S.sid = sid; S.sname = sname;
    if (!/^\d{5}$/.test(sid)) { joinErr = "학번 5자리를 숫자로 입력하세요. (예: 2학년 1반 1번 → 20101)"; joinForce = ""; render(); return; }
    if (sname.length < 2) { joinErr = "이름을 입력하세요."; joinForce = ""; render(); return; }
    var name = sid + " " + sname, force = joinForce === name;
    joining = true; joinErr = ""; if (S.name !== name) { S = fresh(name); S.sid = sid; S.sname = sname; } render();
    var req = HAS ? call("apiJoin", { name: name, force: force }) : Promise.resolve({ ok: true, name: name, demo: true, state: null, cfg: CFG });
    req.then(function (r) {
      if (r && r.dup) {                                   /* 같은 학번에 다른 이름의 기록이 있다: 한 번 더 누르면 입장 */
        joining = false; joinForce = name;
        joinErr = "이 학번으로 다른 이름의 기록이 이미 있습니다. 학번과 이름을 다시 확인하세요. 맞다면 ‘이대로 입장’을 누르세요.";
        render(); return;
      }
      if (!r || !r.ok) throw new Error("join");
      joinForce = "";
      CFG = withDefaults(r.cfg);
      var server = null; try { server = r.state ? JSON.parse(r.state) : null; } catch (e) {}
      var local = S, push = false;
      if (!r.demo) {
        if (server && (server.rev || 0) >= (local.rev || 0)) S = server;          /* 다른 기기에서 이어 하기 */
        else if (!server && local.synced) S = fresh(r.name);                      /* 선생님이 기록을 지운 경우 */
        else push = local.rev > 0;                                                /* 이 기기의 기록이 더 새로움 */
      }
      S.name = r.name; S.sid = sid; S.sname = sname; norm(); joining = false;
      var first = !S.start; if (first) S.start = Date.now();
      S.view = "map"; save(); ui = freshUi(); render(); window.scrollTo(0, 0);
      if (first) { queueSave(); celebrate("start"); } else if (push || S.outbox.length) queueSave();
      else { var el = app.querySelector(".camp.open"); if (el && el.scrollIntoView) el.scrollIntoView({ block: "center" }); }
      if (!first) { checkNote(); maybeTour(); }            /* 밀린 핵심 정리와 아직 못 본 안내를 차례로 */
    }).catch(function () { joining = false; joinErr = "접속하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요."; render(); });
  }

  /* ---------- 입력 ---------- */
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || b.disabled) return;
    var d = b.dataset;
    if (d.act === "start") join();
    else if (d.act === "admin") { adm.err = ""; S.view = "admin"; render(); window.scrollTo(0, 0); }
    else if (d.act === "adminExit") { adm = freshAdm(); S.view = "intro"; render(); }
    else if (d.act === "adminLogin") { var pw = document.getElementById("adminPw").value; if (!pw) { adm.err = "비밀번호를 입력하세요."; render(); } else adminLoad(pw); }
    else if (d.act === "adminRefresh") adminLoad(adm.pw);
    else if (d.act === "adminSort") { adm.byBad = !adm.byBad; render(); }
    else if (d.act === "adminDelAll") confirmDelete([], true);
    else if (d.act === "adminDelSel") { var picked = Object.keys(adm.sel).filter(function (k) { return adm.sel[k] && adm.data.some(function (x) { return x.sid + " " + x.name === k; }); }); if (picked.length) confirmDelete(picked, false); }
    else if (d.cls) { adm.open = adm.open === d.cls ? null : d.cls; adm.stu = null; adm.sel = {}; adm.msg = ""; render(); }
    else if (d.stu) { adm.stu = adm.stu === d.stu ? null : d.stu; render(); var ap = document.getElementById("ansPanel"); if (ap && ap.scrollIntoView) ap.scrollIntoView({ block: "start", behavior: calm ? "auto" : "smooth" }); }
    else if (d.learn) { go("learn", d.learn); }
    else if (d.act === "lnext" || d.act === "lprev") { stopPlay(); ui.page += d.act === "lnext" ? 1 : -1; ui.mwk = 0; render(); window.scrollTo(0, 0); }
    else if (d.act === "ldone") {
      var lc = S.cur, firstL = !S.learn[lc];
      if (firstL) { S.learn[lc] = Date.now(); queueSave({ camp: CAMPS[BYKEY[lc]].name, id: "개념", ver: "", result: "개념 보기 완료", score: 0, miss: 0, work: "" }); }
      go("map");
    }
    else if (d.act === "play") play();
    else if (d.act === "final") go("final");
    else if (d.gate) checkGate(d.gate);
    else if (d.act === "map") go("map");
    else if (d.act === "record") go("record");
    else if (d.act === "restart") restart();
    else if (d.act === "hint") { var hs = st(S.cur); hs.hintOpen = true; hs.hints = (hs.hints || 0) + 1; dirty = true; save(); render(); }
    else if (d.ex != null) { exOpen[d.ex] = true; render(); }
    else if (d.prob) {
      var np = BYID[d.prob]; if (!np || (!probOpen(np) && !isDone(np))) return;
      st(d.prob); go("prob", d.prob);
    }
    else if (d.opt != null) pickOpt(+d.opt);
    else if (d.field != null) { if (!ui.ok[+d.field]) { ui.active = +d.field; render(); } }
    else if (d.key) pressKey(d.key);
  });
  app.addEventListener("input", function (e) {
    if (e.target.dataset.scrub != null && MW) { stopPlay(); mwDraw(+e.target.value); ui.mwk = MW.k; return; }
    var b = e.target.dataset.blank; if (b) { var kv = b.split(":"); (S.final.vals[kv[0]] = S.final.vals[kv[0]] || [])[+kv[1]] = e.target.value; e.target.classList.remove("no"); save(); }
  });
  app.addEventListener("change", function (e) {
    var w = e.target.dataset && e.target.dataset.sel; if (!w) return;
    adm.sel[w] = e.target.checked; adm.msg = ""; render();
  });
  document.addEventListener("keydown", function (e) {
    if (document.querySelector(".cele, .note, .tour")) return;
    if (S.view === "admin") { if (e.key === "Enter" && e.target.id === "adminPw") { var lb = app.querySelector("[data-act=adminLogin]"); if (lb) lb.click(); } return; }
    if (S.view === "final") { if (e.key === "Enter" && e.target.dataset.blank) checkGate(e.target.dataset.blank.split(":")[0]); return; }
    if (S.view === "intro") { if (e.key === "Enter" && !joining) join(); return; }
    if (S.view !== "prob" || e.target.tagName === "INPUT") return;
    if (/^[0-9]$/.test(e.key) || e.key === "-" || e.key === "/") { pressKey(e.key); e.preventDefault(); }
    else if (e.key === "Backspace") { pressKey("⌫"); e.preventDefault(); }
    else if (e.key === "Enter" && !e.target.closest("button")) pressKey("go");
  });
  window.addEventListener("pagehide", function () { if (dirty) queueSave(); });

  render();
})();

</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" async></script>
